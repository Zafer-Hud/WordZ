name: Build WordZ APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      WORDZ_KEYSTORE_PATH: ${{ github.workspace }}/.wordz-signing/wordz-test.keystore

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Restore stable WordZ signing key
        uses: actions/cache@v4
        with:
          path: .wordz-signing
          key: wordz-debug-signing-v1

      - name: Create signing key on first build
        shell: bash
        run: |
          mkdir -p .wordz-signing
          if [ ! -f "$WORDZ_KEYSTORE_PATH" ]; then
            keytool -genkeypair \
              -keystore "$WORDZ_KEYSTORE_PATH" \
              -storepass wordztest123 \
              -keypass wordztest123 \
              -alias wordz-test \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=WordZ Test, OU=WordZ, O=Zafer, L=Istanbul, ST=Istanbul, C=TR"
          fi

      - name: Run Base44 core tests
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk WordZ-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WordZ-debug-apk
          path: WordZ-debug.apk
          retention-days: 30
